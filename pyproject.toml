[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mechinterp-samples"
version = "0.1.0"
description = "Runnable, readable mechanistic-interpretability demonstrations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mikkeyboi" }]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Activation capture needs a model runtime. Kept optional so the analysis,
# tests, and the synthetic demo run with no GPU and no large download.
capture = [
    "torch>=2.7",
    "transformers>=4.44",
    "accelerate>=0.30",
]
notebook = ["jupyter>=1.0", "nbformat>=5.9"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
