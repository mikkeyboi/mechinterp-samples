[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mechinterp-samples"
version = "0.1.0"
description = "Runnable, readable mechanistic-interpretability demonstrations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mikkeyboi" }]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Activation capture needs a model runtime. Kept optional so the analysis,
# tests, and the synthetic demo run with no GPU and no large download.
capture = [
    "torch>=2.7",
    "transformers>=4.44",
    "accelerate>=0.30",
]
notebook = ["jupyter>=1.0", "nbformat>=5.9"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# Match the package's supported floor.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# A pragmatic set: pyflakes (F) catches the real bugs (unused/undefined names,
# the kind of thing a reviewer flagged), pycodestyle errors (E) catch syntax-ish
# issues. We are not enforcing import-ordering or docstring style here.
select = ["F", "E"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are deliberately non-linear: imports mid-cell (E402), multiple
# imports/statements per line (E401/E702) are idiomatic exploration, not bugs.
"*.ipynb" = ["E401", "E402", "E702"]
# dev-and-demo path bootstrap: scripts may need a small amount of latitude.
"samples/**" = ["E402"]
