name: CI

# Validate current and future samples on every push and PR to main.
# Jobs are intentionally small and independent so a failure points at one thing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff>=0.5
      - name: Ruff check
        run: ruff check src samples scripts tests

  privacy:
    name: Privacy gate (no identity / delegation voice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tracked files for identity / agent-voice leaks
        run: python scripts/check_privacy.py

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run model-free test suite
        run: pytest -q

  samples:
    name: Samples run standalone (fresh-clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately install ONLY the runtime deps, NOT the package itself, so the
      # validator proves each sample bootstraps its own import path from a fresh
      # clone (the blindspot that bit us: importable under pytest but not when run
      # directly). Runtime deps come from the project's core dependency set.
      - name: Install runtime deps only (no editable install)
        run: pip install "numpy>=1.24" "scikit-learn>=1.3" "matplotlib>=3.7"
      - name: Validate + run every sample
        env:
          SAMPLE_RUN_TIMEOUT: "420"
        run: python scripts/validate_samples.py

  package:
    name: Package builds + imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Install the built wheel into a clean venv and import it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import mechinterp_samples as m; print('import ok:', sorted(n for n in dir(m) if not n.startswith('_'))[:6])"
